name: Windows Cloud RDP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 1.5 Install Chinese Language (登录即中文)
        shell: powershell
        run: |
          Write-Host ">>> 第1步：尝试在线安装中文语言包（最多等5分钟）..." -ForegroundColor Yellow
          $job = Start-Job { Install-Language zh-CN -ErrorAction Stop }
          if (Wait-Job $job -Timeout 300) {
            Receive-Job $job
            Write-Host ">>> 在线安装成功！" -ForegroundColor Green
          } else {
            Stop-Job $job -ErrorAction SilentlyContinue
            Write-Host ">>> 在线安装失败，改用离线ISO方案（下载6.4G，请耐心）..." -ForegroundColor Red
            $isoPath = "C:\langpack.iso"
            if (-not (Test-Path $isoPath)) {
              curl.exe -L -o $isoPath "https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26100.1.240331-1435.ge_release_amd64fre_SERVER_LOF_PACKAGES_OEM.iso"
            }
            $mount = Mount-DiskImage -ImagePath $isoPath -PassThru
            $drive = (($mount | Get-Volume).DriveLetter) + ":"
            $cab = Get-ChildItem "$drive\LanguagesAndOptionalFeatures\" -Filter "*zh-cn*.cab" -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -like "*Language-Pack*" } | Select-Object -First 1
            if (-not $cab) { $cab = Get-ChildItem "$drive\LanguagesAndOptionalFeatures\" -Filter "*zh-cn*.cab" | Select-Object -First 1 }
            dism /online /add-package /packagepath:"$($cab.FullName)"
            Write-Host ">>> 离线安装完成！" -ForegroundColor Green
          }
          Set-WinUILanguageOverride -Language zh-CN
          Set-Culture zh-CN
          Write-Host ">>> 显示语言已设为中文，登录即中文界面" -ForegroundColor Green

      - name: 2. Create Admin Account
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvdAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "  >> 界面已设置为中文，登录即中文" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (48 Hours)
        shell: powershell
        run: |
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] Server running..."
          }
